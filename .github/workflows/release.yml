name: Production Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend/spring-boot-app
          - name: frontend
            context: frontend/nextjs-app
          - name: ai-agent
            context: ai/agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/circlenet-${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - working-directory: mobile/flutter-app
        run: flutter pub get && flutter build appbundle --release --dart-define=API_BASE_URL=${{ vars.PRODUCTION_API_URL }}
      - uses: actions/upload-artifact@v4
        with: { name: circlenet-android-${{ github.ref_name }}, path: mobile/flutter-app/build/app/outputs/bundle/release/app-release.aab }

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - working-directory: mobile/flutter-app
        run: flutter pub get && flutter build ios --release --no-codesign --dart-define=API_BASE_URL=${{ vars.PRODUCTION_API_URL }}
      - uses: actions/upload-artifact@v4
        with: { name: circlenet-ios-unsigned-${{ github.ref_name }}, path: mobile/flutter-app/build/ios/iphoneos/Runner.app }
