apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: circlenet }
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      serviceAccountName: circlenet-backend
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: backend
          image: ghcr.io/OWNER/circlenet-backend:VERSION
          ports: [{ containerPort: 8080 }]
          envFrom: [{ secretRef: { name: circlenet-secrets } }, { configMapRef: { name: circlenet-config } }]
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: '1', memory: 1Gi } }
          readinessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 20, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 45, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: circlenet }
spec: { selector: { app: backend }, ports: [{ port: 8080, targetPort: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: circlenet }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: frontend
          image: ghcr.io/OWNER/circlenet-frontend:VERSION
          ports: [{ containerPort: 3000 }]
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          readinessProbe: { httpGet: { path: /, port: 3000 }, initialDelaySeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: circlenet }
spec: { selector: { app: frontend }, ports: [{ port: 3000, targetPort: 3000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ai-agent, namespace: circlenet }
spec:
  replicas: 2
  selector: { matchLabels: { app: ai-agent } }
  template:
    metadata: { labels: { app: ai-agent } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: ai-agent
          image: ghcr.io/OWNER/circlenet-ai:VERSION
          ports: [{ containerPort: 8081 }]
          env: [{ name: AI_ENV, value: production }, { name: AI_LOG_LEVEL, value: INFO }]
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          readinessProbe: { httpGet: { path: /api/v1/ready, port: 8081 }, initialDelaySeconds: 8, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/v1/health, port: 8081 }, initialDelaySeconds: 20, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: ai-agent, namespace: circlenet }
spec: { selector: { app: ai-agent }, ports: [{ port: 8081, targetPort: 8081 }] }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: circlenet-backend, namespace: circlenet }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: backend, namespace: circlenet }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: backend }
  minReplicas: 2
  maxReplicas: 10
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
