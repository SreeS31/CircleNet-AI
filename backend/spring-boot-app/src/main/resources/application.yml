spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:circlenet_ai}
    username: ${POSTGRES_USER:circlenet}
    password: ${POSTGRES_PASSWORD:${postgres_password:circlenet123}}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/dev
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false
  security:
    user:
      name: admin
      password: admin123

server:
  port: 8080
  tomcat:
    max-swallow-size: 12MB

spring.servlet.multipart:
  max-file-size: 25MB
  max-request-size: 30MB

circlenet:
  storage:
    provider: ${CIRCLENET_STORAGE_PROVIDER:local}
    user-quota-bytes: ${CIRCLENET_MEDIA_USER_QUOTA_BYTES:1073741824}
    retention-cleanup-cron: ${CIRCLENET_MEDIA_CLEANUP_CRON:0 30 2 * * *}
    local-directory: ${CIRCLENET_UPLOAD_DIR:./var/circlenet/uploads}
    public-base-url: ${CIRCLENET_MEDIA_BASE_URL:http://localhost:8080}
    s3:
      bucket: ${CIRCLENET_S3_BUCKET:}
      region: ${CIRCLENET_S3_REGION:ap-south-1}
      endpoint: ${CIRCLENET_S3_ENDPOINT:}
  notifications:
    dispatch-delay-ms: ${CIRCLENET_NOTIFICATION_DISPATCH_MS:5000}
    webhook:
      channel: ${CIRCLENET_NOTIFICATION_WEBHOOK_CHANNEL:}
      url: ${CIRCLENET_NOTIFICATION_WEBHOOK_URL:}
      token: ${CIRCLENET_NOTIFICATION_WEBHOOK_TOKEN:}
  ai:
    base-url: ${CIRCLENET_AI_BASE_URL:http://localhost:8081/api/v1}

security:
  jwt:
    secret: ${JWT_SECRET:${jwt_secret:circlenet-local-dev-jwt-secret-please-change-2026-strong}}
