spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:circlenet_ai}
    username: ${POSTGRES_USER:circlenet}
    password: ${POSTGRES_PASSWORD:circlenet123}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/dev
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false
  security:
    user:
      name: admin
      password: admin123

server:
  port: 8080
  tomcat:
    max-swallow-size: 12MB

spring.servlet.multipart:
  max-file-size: 5MB
  max-request-size: 20MB

circlenet:
  storage:
    local-directory: ${CIRCLENET_UPLOAD_DIR:./var/circlenet/uploads}
    public-base-url: ${CIRCLENET_MEDIA_BASE_URL:http://localhost:8080}

security:
  jwt:
    secret: ${JWT_SECRET:circlenet-local-dev-jwt-secret-please-change-2026-strong}
