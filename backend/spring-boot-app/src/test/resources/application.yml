spring:
  datasource:
    url: jdbc:h2:mem:circlenet-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/dev
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false
circlenet:
  rate-limit:
    auth-per-minute: 10000
    api-per-minute: 10000
security:
  jwt:
    secret: circlenet-automated-test-jwt-secret-2026-strong
